[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "paperfolio"
version = "0.1.0"
description = "Offline paper-trading portfolio checks with stop-loss flags"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Moco"}]

[project.scripts]
paperfolio = "paperfolio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
